name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Actions sets GITHUB_ACTIONS, which is what switches vite.config.ts onto the
# /Chambre-Noire/ base path a project Pages site is served from.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than racing them, and let one in flight finish so a
# half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Lint and tests gate the deploy, so a red build cannot reach the
      # published site even though CI also runs them on this push.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
